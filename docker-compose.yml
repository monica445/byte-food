services:
  postgres:
    image: postgres:17
    container_name: byteme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: byteme
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: byte_food
    ports:
      - "5434:5432"
    volumes:
      - byteme_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byteme -d byte_food"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  byteme_postgres_data:
